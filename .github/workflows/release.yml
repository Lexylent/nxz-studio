name: NXZ Studio — Windows Release & CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Target
        uses: Swatinem/rust-cache@v2

      - name: Run Release Test Suite
        run: cargo test --release

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Prepare NXZ-Studio-Setup.exe & NXZ-Studio.exe Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/nxz.exe" "dist/NXZ-Studio-Setup.exe" -Force
          Copy-Item "target/release/nxz.exe" "dist/NXZ-Studio.exe" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NXZ-Studio-Windows-x64
          path: |
            dist/NXZ-Studio-Setup.exe
            dist/NXZ-Studio.exe

      - name: Publish GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NXZ-Studio-Setup.exe
            dist/NXZ-Studio.exe
          generate_release_notes: true
